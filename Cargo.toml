[package]
name = "happy_chart_rs"
version = "1.17.2"
edition = "2021"
license = "GPL-3.0-only"
description = "A subjective day quality charting program"
keywords = ["happy","charting","mental-health","binary", "journal"]
readme = "README.MD"
repository = "https://github.com/CoryRobertson/happy_chart_rs"
homepage = "https://github.com/CoryRobertson/happy_chart_rs"
categories = ["visualization","value-formatting"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = true
lto = true

[dependencies]
eframe = { version = "0.29", features = ["serde", "accesskit"]}
egui = { version = "0.29", features = ["serde", "accesskit"]}
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde_json = "1.0"
rfd = "0.15"
image = "0.25"
# deflate should be used for release packages
# example file name:
# happy_chart_rs-v1.10.2-x86_64-pc-windows-msvc.zip
self_update = { version = "0.41", features = ["archive-zip","compression-flate2","compression-zip-bzip2","compression-zip-deflate"]}
zip = "^0.6.6"
tracing = { version = "0.1" }
tracing-tracy = { version = "0.11", optional = true, features = ["default","flush-on-exit"]}
tracing-subscriber = {  version = "0.3", features = ["fmt"] }
strum = "0.26"
strum_macros = "0.26"
csv = "1.3"
cocoon = "0.4"
rand = "0.8"

[features]
tracing = ["dep:tracing-tracy"]

[build-dependencies]
vergen = { version = "9.0", features = ["build"] }
vergen-git2 = { version = "1.0", features = ["build"]}
walkdir = "2.5.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
divan = "0.1"
rand = "0.8"
proptest = "1.5" # want to learn to use this, even if it's not used in a super useful way :)
#insta = "1.41"

[[bench]]
name = "stat_benches"
harness = false
